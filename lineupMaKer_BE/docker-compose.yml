services:
  postgres:
    image: postgres:16-alpine
    container_name: lineupmaker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lineupmaker}
      POSTGRES_USER: ${DB_USERNAME:-lineupmaker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lineupmaker}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lineupmaker} -d ${DB_NAME:-lineupmaker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: lineupmaker-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-lineupmaker}
      DB_USERNAME: ${DB_USERNAME:-lineupmaker}
      DB_PASSWORD: ${DB_PASSWORD:-lineupmaker}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
